name: Basic CI (no MATLAB required)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  basic-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: SPDX / license header check (.m files)
        shell: bash
        run: |
          python tools/test_check_spdx.py || exit $?

      - name: Detect large files (>10MB)
        shell: bash
        run: |
          echo "Searching for files larger than 10MB..."
          big=$(git ls-files -z | xargs -0 -I{} bash -c 'f="{}"; s=$(stat -c%s "$f" 2>/dev/null || echo 0); if [ "$s" -gt $((10*1024*1024)) ]; then echo "$f|$s"; fi' || true)
          if [ -n "$big" ]; then
            echo "Found large files (name|size):"
            echo "$big"
            echo "Please avoid committing large binaries. Consider using git-lfs or remove them."
            exit 1
          else
            echo "No large files found."
          fi

      - name: Test environment manager (no MATLAB, no downloads)
        run: python -m unittest discover -s tests/agent -v

      - name: Parse PowerShell entry point
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/agent/agent-env.ps1'), [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
